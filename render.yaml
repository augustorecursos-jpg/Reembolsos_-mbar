# Blueprint do Render (render.com → New → Blueprint → este repositório).
#
# VERSÃO DE TESTE: plano gratuito, sem disco permanente. Os dados de demonstração são criados a cada
# inicialização e tudo o que for feito no teste se perde quando o serviço reinicia ou "dorme".
#
# Para PRODUÇÃO, troque para:
#   plan: starter
#   startCommand: npm start
# e acrescente o disco (os dados e anexos passam a ser permanentes):
#   disk:
#     name: dados-reembolsos
#     mountPath: /var/data
#     sizeGB: 5
#   + a variável DATA_DIR = /var/data
services:
  - type: web
    name: reembolsos-ambar
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci
    startCommand: npm run seed && npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
